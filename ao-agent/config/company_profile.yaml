# Profil entreprise utilisé par l'agent pour évaluer la pertinence d'un AO.
# Personnalisez ces valeurs pour Soma Smart.
#
# Les références internes (anciennes missions) ne sont plus listées ici depuis la V1 :
# elles vivent comme fichiers .md dans le dossier `references/` et sont retrouvées
# automatiquement par recherche sémantique (RAG) au moment de l'analyse.

nom_entreprise: "Soma Smart"

secteurs_cibles:
  - "Data & IA"
  - "Conseil / transformation numérique"
  - "Secteur public"

budget_min_eur: 20000
budget_max_eur: 500000

expertises_cles:
  - "RAG / retrieval augmenté"
  - "Agents IA / agentique"
  - "MLOps et industrialisation IA"
  - "Gouvernance et sécurité de l'IA"
  - "Data engineering"

red_flags:
  - "Délai de réponse à l'AO inférieur à 5 jours ouvrés"
  - "Budget non communiqué et hors de la fourchette cible"
  - "Exigence de développement propriétaire cédé sans contrepartie"
